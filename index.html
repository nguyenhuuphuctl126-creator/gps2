<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>WebAR - Con Cua</title>
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
</head>

<body style="margin: 0; overflow: hidden;">
    
    <a-scene 
        embedded 
        vr-mode-ui="enabled: false"
        arjs="sourceType: webcam; debugUIEnabled: true;">
        
        <a-assets>
            <a-asset-item id="bird-obj" src="./assets/10012_crab_v2_iterations-1.obj"></a-asset-item>
            <a-asset-item id="bird-mtl" src="./assets/10012_crab_v2_iterations-1.mtl"></a-asset-item>
        </a-assets>

        <a-entity 
            gps-entity-place="latitude: 10.42144990210269; longitude: 105.6441553992754;" 
            obj-model="obj: #bird-obj; mtl: #bird-mtl" 
            scale="1 1 1"
            look-at="[gps-camera]">
        </a-entity>
        
        <a-camera gps-camera rotation-reader></a-camera>
        
    </a-scene>
</body>
</html>
